name: agent

on:
  push:
    tags:
      - "v*"

concurrency:
  group: agent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  versions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      xray: ${{ steps.v.outputs.xray }}
      mihomo: ${{ steps.v.outputs.mihomo }}
      singbox: ${{ steps.v.outputs.singbox }}
      geo: ${{ steps.v.outputs.geo }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          set -a
          . ./deploy/cores.versions
          set +a
          echo "xray=${XRAY_TAG}" >> "$GITHUB_OUTPUT"
          echo "mihomo=${MIHOMO_TAG}" >> "$GITHUB_OUTPUT"
          echo "singbox=${SINGBOX_TAG}" >> "$GITHUB_OUTPUT"
          echo "geo=${GEO_TAG}" >> "$GITHUB_OUTPUT"

  agent:
    needs: versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build agent
        env:
          CGO_ENABLED: "0"
          GOWORK: "off"
        run: |
          go build -trimpath \
            -ldflags "-X nowhere.local/agent/internal/agent.Version=${GITHUB_REF_NAME} -X github.com/metacubex/mihomo/constant.Version=${{ needs.versions.outputs.mihomo }}" \
            -o nowhere-agent ./cmd/agent
      - uses: actions/upload-artifact@v4
        with:
          name: nowhere-agent
          path: nowhere-agent
          if-no-files-found: error

  xray:
    needs: versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ohmycggk/Xray-core
          ref: ${{ needs.versions.outputs.xray }}
          path: src
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Build xray
        working-directory: src
        env:
          CGO_ENABLED: "0"
          GOTOOLCHAIN: local
        run: go build -trimpath -o "$GITHUB_WORKSPACE/xray" ./main
      - uses: actions/upload-artifact@v4
        with:
          name: xray
          path: xray
          if-no-files-found: error

  singbox:
    needs: versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ohmycggk/sing-box
          ref: ${{ needs.versions.outputs.singbox }}
          path: src
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
      - name: Build sing-box
        working-directory: src
        env:
          CGO_ENABLED: "0"
          GOWORK: "off"
        run: |
          # Go 1.25 拒绝 badlinkname。流量统计仍要 with_v2ray_api，缺它会在 run 期回滚。
          tags="$(tr ',' '\n' < release/DEFAULT_BUILD_TAGS_OTHERS | grep -v -x -E 'badlinkname|tfogo_checklinkname0' | tr '\n' ',' | sed 's/,$//'),with_v2ray_api"
          go build -trimpath \
            -tags "${tags}" \
            -o "$GITHUB_WORKSPACE/sing-box" ./cmd/sing-box
      - uses: actions/upload-artifact@v4
        with:
          name: sing-box
          path: sing-box
          if-no-files-found: error

  geo:
    needs: versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download geo
        env:
          GEO_TAG: ${{ needs.versions.outputs.geo }}
        run: |
          base="https://github.com/Loyalsoldier/v2ray-rules-dat/releases/download/${GEO_TAG}"
          curl -fsSL -o geoip.dat "${base}/geoip.dat"
          curl -fsSL -o geoip.dat.sha256sum "${base}/geoip.dat.sha256sum"
          curl -fsSL -o geosite.dat "${base}/geosite.dat"
          curl -fsSL -o geosite.dat.sha256sum "${base}/geosite.dat.sha256sum"
          sha256sum -c geoip.dat.sha256sum
          sha256sum -c geosite.dat.sha256sum
      - uses: actions/upload-artifact@v4
        with:
          name: geo
          path: |
            geoip.dat
            geosite.dat
          if-no-files-found: error

  release:
    needs: [versions, agent, xray, singbox, geo]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: image
          merge-multiple: true
      - name: Assemble context
        run: cp deploy/entrypoint.sh image/entrypoint.sh
      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push image
        run: |
          set -a
          . ./deploy/cores.versions
          set +a
          tag="${GITHUB_REF_NAME}"
          image="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          args=(
            --build-arg "VERSION=${tag}"
            --build-arg "XRAY_TAG=${XRAY_TAG}"
            --build-arg "MIHOMO_TAG=${MIHOMO_TAG}"
            --build-arg "SINGBOX_TAG=${SINGBOX_TAG}"
            --build-arg "GEO_TAG=${GEO_TAG}"
          )
          docker build -f deploy/Dockerfile.image "${args[@]}" --target xray -t "${image}:${tag}-xray" -t "${image}:xray" image
          docker build -f deploy/Dockerfile.image "${args[@]}" --target mihomo -t "${image}:${tag}" -t "${image}:latest" image
          docker build -f deploy/Dockerfile.image "${args[@]}" --target singbox -t "${image}:${tag}-singbox" -t "${image}:singbox" image
          docker push "${image}:${tag}-xray"
          docker push "${image}:xray"
          docker push "${image}:${tag}"
          docker push "${image}:latest"
          docker push "${image}:${tag}-singbox"
          docker push "${image}:singbox"
          {
            echo "IMAGE_XRAY=${image}:xray"
            echo "IMAGE_LATEST=${image}:latest"
            echo "IMAGE_SINGBOX=${image}:singbox"
            echo "XRAY_TAG=${XRAY_TAG}"
            echo "MIHOMO_TAG=${MIHOMO_TAG}"
            echo "SINGBOX_TAG=${SINGBOX_TAG}"
            echo "GEO_TAG=${GEO_TAG}"
          } >> "$GITHUB_ENV"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release delete "${tag}" --yes || true
          gh release create "${tag}" \
            --title "${tag}" \
            --notes "$(printf 'nwdock-agent %s\n\nxray %s\n%s\n\n内置 %s\n%s\n\nsing-box %s\n%s\n\ngeo %s\n' \
              "${tag}" \
              "${XRAY_TAG}" "${IMAGE_XRAY}" \
              "${MIHOMO_TAG}" "${IMAGE_LATEST}" \
              "${SINGBOX_TAG}" "${IMAGE_SINGBOX}" \
              "${GEO_TAG}")" \
            image/nowhere-agent
