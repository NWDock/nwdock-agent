name: agent

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: agent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build agent
        env:
          CGO_ENABLED: "0"
        run: |
          tag="${GITHUB_REF_NAME}"
          go build -trimpath \
            -ldflags "-X nowhere.local/agent/internal/agent.Version=${tag}" \
            -o nowhere-agent ./cmd/agent

      - name: Build image
        run: |
          tag="${GITHUB_REF_NAME}"
          docker build \
            -f deploy/Dockerfile.source \
            --build-arg "VERSION=${tag}" \
            -t "nwdock-agent:${tag}" .
          docker save "nwdock-agent:${tag}" -o "nwdock-agent-${tag}.tar"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "${tag}" \
            --title "${tag}" \
            --notes "nwdock-agent ${tag}" \
            nowhere-agent \
            "nwdock-agent-${tag}.tar"
