name: agent

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: agent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build agent
        env:
          CGO_ENABLED: "0"
        run: |
          tag="${GITHUB_REF_NAME}"
          go build -trimpath \
            -ldflags "-X nowhere.local/agent/internal/agent.Version=${tag}" \
            -o nowhere-agent ./cmd/agent

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        run: |
          tag="${GITHUB_REF_NAME}"
          image="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          docker build \
            -f deploy/Dockerfile.source \
            --build-arg "VERSION=${tag}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${tag}" \
            -t "${image}:${tag}" .
          docker push "${image}:${tag}"
          echo "IMAGE=${image}:${tag}" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "${tag}" \
            --title "${tag}" \
            --notes "nwdock-agent ${tag}"$'\n\n'"镜像：${IMAGE}" \
            nowhere-agent
