name: agent

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build agent
        env:
          CGO_ENABLED: "0"
        run: |
          version=$(git describe --tags --always --dirty)
          go build -trimpath \
            -ldflags "-X nowhere.local/agent/internal/agent.Version=${version}" \
            -o nowhere-agent ./cmd/agent

      - uses: actions/upload-artifact@v4
        with:
          name: nowhere-agent-${{ github.sha }}
          path: nowhere-agent
          if-no-files-found: error

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          version=$(git describe --tags --always --dirty)
          docker build \
            -f deploy/Dockerfile.source \
            --build-arg "VERSION=${version}" \
            -t "nwdock-agent:${{ github.sha }}" .

      - name: Save image
        run: docker save "nwdock-agent:${{ github.sha }}" -o nwdock-agent.tar

      - uses: actions/upload-artifact@v4
        with:
          name: nwdock-agent-image-${{ github.sha }}
          path: nwdock-agent.tar
          if-no-files-found: error
