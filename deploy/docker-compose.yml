services:
  agent:
    image: ghcr.io/nwdock/nwdock-agent:latest
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_BIND_SERVICE
    environment:
      AGENT_RUNTIME: docker
      AGENT_DATA_DIR: /var/lib/nowhere-agent
      AGENT_PANEL_ENDPOINTS: https://panel.example
      AGENT_PANEL_KEYPIN: change-me
    volumes:
      - agent-data:/var/lib/nowhere-agent

volumes:
  agent-data:
